# cluster name
cluster.name: my-application
# node name
node.name: node-1
# storage directory for data and logs
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs
#Set the bound IP; setting it to 0.0.0.0 allows any computer node to access it
network.host: 0.0.0.0
transport.host: 0.0.0.0
network.publish_host: 192.168.0.107
# port
http.port: 9200
# Set the names of all nodes in the cluster; this node name is the one modified earlier. You may also use the default; currently it is a single machine, so just put one node
discovery.seed_hosts: [ "192.168.0.112:9300","192.168.0.107:9301","192.168.0.107:9302", "192.168.0.107:9300"]
cluster.initial_master_nodes: [ "192.168.0.112:9300","192.168.0.107:9301","192.168.0.107:9302", "192.168.0.107:9300"]
cluster.routing.allocation.same_shard.host: true
discovery.zen.fd.ping_timeout: 1m
discovery.zen.fd.ping_retries: 5

# Set this parameter to ensure that nodes in the cluster can know about the other N nodes eligible for master. The default is 1; for large clusters, you can set a larger value (2-4)
