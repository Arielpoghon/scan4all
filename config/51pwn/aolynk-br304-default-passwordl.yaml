id: aolynk-br304-default-password
info:
  name: Huawei Aolynk BR304+ Intelligent Security Router Default Password
  author:
  - 51pwn
  description: |-
    fofa: Aolynk BR304
requests:
  - raw:
      - |
        GET /index_main.html HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic YWRtaW46YWRtaW4=
    matchers:
      - type: status
        status:
        - 200
      - type: word
        condition: and
        part: body
        words:
        - '/menu_admin.html'
    matchers-condition: and
    redirects: false
  