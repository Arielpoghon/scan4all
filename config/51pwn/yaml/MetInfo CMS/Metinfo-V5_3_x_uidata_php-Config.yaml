id: Metinfo-V5_3_x_uidata_php-Config
info:
  name: MetInfo v5.3.x uidata.php config information disclosure.
  author:
  - l0ne1y
  description: |-
    MetInfo v5.3.x uidata.php config information disclosure.
    MetInfo is an open-source, free CMS building system suitable for enterprise websites. The MetInfo enterprise website management system is mainly used to build enterprise websites and uses a PHP+Mysql architecture.

    The MetInfo v5.3.x uidata.php config page has an information disclosure vulnerability. An attacker can exploit it to obtain sensitive information.
  severity: low
  remediation: |-
    Remediation:

    Official Fix:<br />1. Upgrade to a non-vulnerable version of the system, or download the security patch from the official site.
    https://www.mituo.cn/

    Temporary Fix:<br />1. Remove sensitive information involved in pages, cookies, or caches, or delete the pages that leak information.<br />2. Store sensitive information encrypted; do not send it to the frontend unless necessary.<br />3. When sending sensitive information, transmit it encrypted, and mask it if necessary.<br />4. Do not use self-developed encryption algorithms; use public, secure standard encryption algorithms.<br />5. Do not log plaintext sensitive data: never record plaintext sensitive data (such as passwords or session identifiers like jsessionid) in logs, to prevent sensitive information leakage.<br />6. Disable caching of web pages containing sensitive data: all pages with sensitive data should be non-cacheable, to prevent sensitive information leakage or cross-user data issues for users behind proxy servers.<br />7. Enforce strict permission authentication for the sensitive data that must be sent or for page request interfaces.
requests:
- matchers:
  - type: status
    status:
    - 200
  - type: regex
    regex:
    - config":(.*)
  matchers-condition: and
  path:
  - '{{BaseURL}}/include/interface/uidata.php'
  method: GET
