- matchers:
  - type: word
    part: body
    words:
    - '{{randomValue}}'
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/mobile/browser/WorkflowCenterTreeData.jsp'
