id: ecology-workflowcentertreedata-sqli
info:
  name: Fanwei OA e-cology WorkflowCenterTreeData Frontend Interface SQL Injection
  author:
  - l0ne1y
  description: |-
    Fanwei OA e-cology WorkflowCenterTreeData Frontend Interface SQL Injection Vulnerability
    Attackers can exploit the vulnerability without authentication to obtain sensitive system data. All Fanwei websites using Oracle databases are potentially affected. The vulnerability is easy to exploit and highly damaging (it can leak sensitive information such as passwords), and it is expected to have a significant impact on Fanwei's primary market -- China.
    This vulnerability is caused by the lack of security checks on the SQL statements involving the Oracle database in the WorkflowCenterTreeData interface of the OA system. Any attacker can inject malicious payloads during SQL statement concatenation, resulting in SQL injection attacks. The vendor has not yet released a patch; all Fanwei websites using Oracle databases are potentially affected. Website administrators are advised to take the relevant websites offline until the vendor releases a patch.
  severity: high
  remediation: |-
    #### Official remediation:
    Upgrade the system to a version without the vulnerability, or download the security patch from the official website.
