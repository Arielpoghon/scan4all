id: joomla-htaccess-file
info:
  name: Joomla htaccess file disclosure
  author:
  - l0ne1y
  description: |-
    Joomla htaccess file information leaked
    Joomla has an htaccess file to store configuration regarding HTTP configuration, directory listings, etc.
  severity: medium
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program:
    http://www.joomla.org/
    Temporary fix:
    1. Prohibit the display of web pages containing sensitive data to prevent the leakage of sensitive information.
    2. Conduct strict permission authentication for sensitive data or page request interfaces that must be sent.
requests:
- matchers:
  - type: word
    condition: and
    words:
    - Joomla
    - Open Source Matters. All rights reserved
  - type: word
    part: header
    words:
    - text/plain
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/htaccess.txt'
  method: GET
