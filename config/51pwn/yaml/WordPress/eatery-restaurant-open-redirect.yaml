id: eatery-restaurant-open-redirect
info:
  name: WordPress Attitude Themes 1.1.1 Open Redirection
  author:
  - l0ne1y
  description: |-
    WordPress Theme Attitude exists URL redirection
    WordPress is a blogging platform developed by the WordPress Foundation using the PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers.

    There is an input validation error vulnerability in nav.php of WordPress Attitude Themes version 1.1.1 and earlier, causing users to be redirected to the -Menu- parameter that it did not validate before.
  severity: low
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/themes/

    Temporary fix:
    1. The code fixes the jump address and does not allow users to control variables.
    2. The redirect target address adopts a whitelist mapping mechanism and only redirects to legal URLs.
    3. Verify the target address of the jump reasonably and fully, and inform the user of the risk of jump if it is not your own address.
requests:
- matchers:
  - type: regex
    part: header
    regex:
    - (?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)example\.com.*$
  path:
  - '{{BaseURL}}/wp-content/themes/eatery/nav.php?-Menu-=https://example.com/'
  method: GET
