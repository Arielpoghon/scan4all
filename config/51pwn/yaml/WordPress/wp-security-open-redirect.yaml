id: wp-security-open-redirect
info:
  name: All In One WP Security & Firewall <= 4.4.1 - Open Redirect & Hidden Login
    Page Exposure
  author:
  - l0ne1y
  description: |-
    WordPress Plugin All In One WP Security & Firewall has URL redirection vulnerability
    WordPress and WordPress plugin are both products of the WordPress Foundation. WordPress is a blogging platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an application plugin.

    There is an input validation error vulnerability in after_logout of WordPress plugin All In One WP Security & Firewall 4.4.1 and earlier versions, causing users to be redirected to a URL address that it did not validate before.
  severity: low
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/plugins/all-in-one-wp-security-and-firewall/

    Temporary fix:
    1. The code fixes the jump address and does not allow users to control variables.
    2. The redirect target address adopts a whitelist mapping mechanism and only redirects to legal URLs.
    3. Verify the target address of the jump reasonably and fully, and inform the user of the risk of jump if it is not your own address.
requests:
- matchers:
  - type: regex
    part: header
    regex:
    - (?m)^(?:Location\s*?:\s*?)(?:https?:\/\/|\/\/|\/\\\\|\/\\)?(?:[a-zA-Z0-9\-_\.@]*)attacker\.com\/?(\/|[^.].*)?$
  path:
  - '{{BaseURL}}/?aiowpsec_do_log_out=1&after_logout=https://attacker.com'
  method: GET
