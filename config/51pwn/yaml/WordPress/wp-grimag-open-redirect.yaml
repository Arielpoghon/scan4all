id: wp-grimag-open-redirect
info:
  name: WordPress Grimag Themes < 1.1.1 Open Redirection
  author:
  - l0ne1y
  description: |-
    WordPress Themes Grimag has URL jump vulnerability
    WordPress is a blogging platform developed by the WordPress Foundation using the PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an open source application plug-in for WordPress.

    There is an input validation error vulnerability in wp-content/themes/Grimag/go.php in WordPress Grimag Themes version 1.1.1 and previous versions, causing users to be redirected to a URL address that it did not validate before.
  severity: low
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.com/zh-cn/themes

    Temporary fix:
    1. The code fixes the jump address and does not allow users to control variables.
    2. The redirect target address adopts a whitelist mapping mechanism and only redirects to legal URLs.
    3. Verify the target address of the jump reasonably and fully, and inform the user of the risk of jump if it is not your own address.
requests:
- matchers:
  - type: regex
    part: header
    regex:
    - (?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)example\.com.*$
  path:
  - '{{BaseURL}}/wp-content/themes/Grimag/go.php?https://example.com'
  method: GET
