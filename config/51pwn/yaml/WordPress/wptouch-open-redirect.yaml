id: wptouch-open-redirect
info:
  name: WPTouch Switch Desktop 3.x Open Redirection
  author:
  - l0ne1y
  description: |-
    WordPress Plugin WPTouch Switch Desktop has URL redirection vulnerability
    WordPress is a blog platform developed by the WordPress Software Foundation using the PHP language. The platform supports the establishment of personal blog websites on PHP and MySQL servers. WPTouch is one of the mobile theme plug-ins.

    The WPTouch Switch Desktop plug-in version 3.X redirect has an input validation error vulnerability, causing users to be redirected to a URL address that it did not verify before.
  severity: medium
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: http://www.wptouch.com/

    Temporary fix:
    1. The code fixes the jump address and does not allow users to control variables.
    2. The redirect target address adopts a whitelist mapping mechanism and only redirects to legal URLs.
    3. Verify the target address of the jump reasonably and fully, and inform the user of the risk of jump if it is not your own address.
requests:
- matchers:
  - type: regex
    part: header
    regex:
    - (?m)^(?:Location\s*?:\s*?)(?:https?://|//)(?:[a-zA-Z0-9\-_\.@]*)example\.com.*$
  path:
  - '{{BaseURL}}/?wptouch_switch=desktop&redirect=https://example.com/'
  method: GET
