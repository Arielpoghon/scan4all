id: attitude-theme-open-redirect
info:
  name: WordPress Attitude Themes 1.1.1 Open Redirection
  author:
  - l0ne1y
  tags:
  - wordpress
  - wp-theme
  - redirect
  description: |-
    Wordpress Theme Attitude Themes 1.1.1 has a URL redirection vulnerability
    WordPress Attitude Themes 1.1.1 accepts user-controlled input, specifying
    A link to an external site and use that link in a redirect.
  reference:
  - https://cxsecurity.com/issue/wlb-2020030185
  severity: low
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: themesinfo.com/attitude-theme-wordpress-portfolio-j1j

    Temporary fix:
    1. The code fixes the jump address and does not allow users to control variables.
    2. The redirect target address adopts a whitelist mapping mechanism and only redirects to legal URLs.
    3. Verify the target address of the jump reasonably and fully, and inform the user of the risk of jump if it is not your own address.
requests:
- matchers:
  - type: regex
    part: header
    regex:
    - (?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)example\.com.*$
  path:
  - '{{BaseURL}}/wp-content/themes/Attitude/go.php?https://example.com/'
  method: GET
