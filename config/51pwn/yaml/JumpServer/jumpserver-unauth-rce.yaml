id: jumpserver-unauth-rce
info:
  name: jumpserver unauth read logfile + jumpserver rce
  author:
  - l0ne1y
  description: |-
    JumpServer unauthorized access and remote code execution vulnerability
    JumpServer is the world's first open-source bastion host. It uses the GNU GPL v2.0 license and is an operation and maintenance security audit system compliant with the 4A standard.

    Some JumpServer interfaces have no authorization restrictions. An attacker can craft malicious requests to obtain log files and sensitive information, or call related API operations to control all machines and execute arbitrary commands.
  severity: critical
  remediation: |-
    Official fix:
    1. It is recommended that users obtain the latest patch or latest version from the official website:
    https://community.fit2cloud.com/#/products/jumpserver/downloads

    Temporary fix:
    1. Modify the Nginx configuration file to block the vulnerable interfaces:
    /api/v1/authentication/connection-token/
    /api/v1/users/connection-token/
requests:
- matchers:
  - type: dsl
    condition: and
    dsl:
    - status_code_1==401&&status_code_2==404
    - all_headers_1=="application/json"&&all_headers_2=="application/json"
    - body_1=="not_authenticated"&&body_2==""
  matchers-condition: and
  path:
  - '{{BaseURL}}/api/v1/users/connection-token/'
  - '{{BaseURL}}/api/v1/authentication/connection-token/?user-only={{randstr}}'
  method: GET
- matchers:
  - type: dsl
    condition: and
    dsl:
    - status_code_1==401&&status_code_2==404
    - all_headers_1=="application/json"&&all_headers_2=="application/json"
    - body_1=="not_authenticated"&&body_2==""
  matchers-condition: and
  path:
  - '{{BaseURL}}/api/v1/authentication/connection-token/'
  - '{{BaseURL}}/api/v1/users/connection-token/?user-only={{randstr}}'
  method: GET
